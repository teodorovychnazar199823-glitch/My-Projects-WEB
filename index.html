<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мої проєкти</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4f1ec;
        color: #1d1d1b;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #161614; color: #ecebe6; }
        a { background: #23231f; border-color: #3a3a34; }
      }
      main { width: min(100% - 32px, 520px); }
      h1 { font-size: 2rem; margin: 0 0 1.5rem; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      a {
        display: block;
        padding: 18px 20px;
        border: 1px solid #d9d4ca;
        border-radius: 12px;
        background: #fff;
        color: inherit;
        text-decoration: none;
        transition: transform 0.15s;
      }
      a:hover { transform: translateY(-2px); }
      a strong { display: block; font-size: 1.15rem; }
      a span { opacity: 0.7; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Мої проєкти</h1>
      <ul>
        <li>
          <a href="tyho/">
            <strong>Тихо</strong>
            <span>Коворкінг і читальня · Львів</span>
          </a>
        </li>
        <li>
          <a href="licey/">
            <strong>Інтелект</strong>
            <span>Сайт Львівського ліцею</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
